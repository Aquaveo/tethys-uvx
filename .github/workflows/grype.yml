name: security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  grype:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [builder, runtime]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.target }} (amd64, load)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64
          load: true
          tags: tethys-uvx:${{ matrix.target }}-scan
          cache-from: type=gha,scope=${{ matrix.target }}

      - name: Scan ${{ matrix.target }} with Grype
        uses: anchore/scan-action@v7
        with:
          image: tethys-uvx:${{ matrix.target }}-scan
          severity-cutoff: high
          only-fixed: true
          fail-build: false
          output-format: table
